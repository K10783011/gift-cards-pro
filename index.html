<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>超商商品卡便捷管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style> svg { image-rendering: pixelated; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl text-indigo-200"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">商品卡數位管家</h1>
          <p class="text-xs text-indigo-200">即時掃描 · 原格式還原 · 本地自動儲存</p>
        </div>
      </div>
      <div class="bg-indigo-800/80 border border-indigo-500/30 rounded-xl px-5 py-2 text-right w-full sm:w-auto flex justify-between sm:block">
        <span class="text-xs text-indigo-200 block sm:inline">目前有效卡總額</span>
        <span id="total-balance" class="text-2xl font-extrabold text-amber-300 ml-2">NT$ 0</span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- Actions -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
      <button onclick="openScanModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 px-4 rounded-xl shadow-sm flex items-center justify-center space-x-2">
        <i class="fa-solid fa-camera"></i><span>開啟相機掃描條碼</span>
      </button>
      <button onclick="triggerFileInput()" class="bg-slate-800 hover:bg-slate-900 text-white py-3.5 px-4 rounded-xl shadow-sm flex items-center justify-center space-x-2">
        <i class="fa-solid fa-file-image"></i><span>照片批次匯入商品卡</span>
      </button>
      <input id="batch-file-input" type="file" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)" />
    </div>

    <!-- Tabs -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-3 mb-4">
      <button onclick="setFilter('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-lg bg-indigo-600 text-white">全部類別</button>
      <button onclick="setFilter('7-11')" id="tab-7-11" class="tab-btn px-4 py-2 rounded-lg bg-white text-slate-600 border">7-ELEVEN</button>
      <button onclick="setFilter('FamilyMart')" id="tab-FamilyMart" class="tab-btn px-4 py-2 rounded-lg bg-white text-slate-600 border">全家 FamilyMart</button>
      <button onclick="setFilter('Hi-Life')" id="tab-Hi-Life" class="tab-btn px-4 py-2 rounded-lg bg-white text-slate-600 border">萊爾富 Hi-Life</button>
      <button onclick="setFilter('宜睿')" id="tab-宜睿" class="tab-btn px-4 py-2 rounded-lg bg-white text-slate-600 border">宜睿</button>
    </div>

    <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-slate-400">
      <i class="fa-solid fa-credit-card text-5xl mb-3"></i>
      <p class="text-base font-medium">尚無相關商品卡記錄</p>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-2">
      <details class="text-sm text-slate-500">
        <summary class="cursor-pointer">最近扣款記錄（debug）</summary>
        <ul id="redemption-list" class="mt-2"></ul>
      </details>
    </div>
  </main>

  <!-- Pay Modal -->
  <div id="pay-modal" class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal('pay-modal')" class="absolute top-4 right-4 text-slate-400 p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="text-center">
        <span id="modal-store-badge" class="px-3 py-1 rounded-full text-xs font-bold text-white inline-block mb-1 bg-emerald-600">7-ELEVEN</span>
        <h3 class="text-lg font-bold text-slate-800">出示條碼結帳</h3>
        <p class="text-xs text-slate-500">請將條碼對準超商刷卡機</p>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 my-4 flex flex-col items-center">
        <svg id="pay-barcode" class="w-full h-24 max-w-xs"></svg>
        <div class="flex items-center space-x-2 mt-2">
          <span id="pay-card-num" class="text-sm font-mono tracking-widest text-slate-700 font-bold"></span>
          <span id="pay-barcode-format" class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full uppercase">CODE128</span>
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex justify-between items-center text-sm font-medium bg-indigo-50 p-3 rounded-lg border">
          <span class="text-slate-600">卡片目前餘額</span>
          <span id="pay-modal-balance" class="text-lg font-bold text-indigo-700">NT$ 0</span>
        </div>

        <!-- Split payment controls (hidden by default) -->
        <div id="split-controls" class="hidden space-y-2">
          <div class="text-sm text-slate-600">付款金額超過此卡，系統會依最小餘額優先顯示下一張卡 (同超商)</div>
          <div class="flex items-center gap-2">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="auto-advance-toggle" /> 自動切換到下一張</label>
            <button id="split-next-btn" type="button" onclick="advanceSplitToNext()" class="px-3 py-1 bg-slate-100 rounded">下一張</button>
            <button id="split-mark-paid-btn" type="button" onclick="markCurrentSplitCardPaid()" class="px-3 py-1 bg-emerald-600 text-white rounded">標記已用此卡並扣款</button>
          </div>
          <div class="text-sm text-slate-500">尚需扣款：<span id="split-remaining">NT$ 0</span></div>
        </div>

        <form id="pay-form" onsubmit="handleCheckout(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">輸入本次消費扣款金額 (NT$)</label>
            <div class="relative">
              <input type="number" id="deduct-amount" min="1" required placeholder="例如：45" class="w-full pl-8 pr-4 py-2.5 border rounded focus:ring-2 focus:ring-indigo-500" />
              <span class="absolute left-3 top-2.5 text-slate-400">$</span>
            </div>
          </div>

          <div class="flex gap-2">
            <button id="pay-submit" type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold">
              <i class="fa-solid fa-check"></i> 完成扣款並更新餘額
            </button>
            <button id="pay-cancel" type="button" onclick="closeModal('pay-modal')" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-lg">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit modal, batch, scan modals unchanged (omitted here for brevity in explanation) -->

<script>
/* Core data & helpers */
const STORAGE_KEY = 'convenience_store_cards';
const REDEMPTION_KEY = 'convenience_store_redemptions';
const LOCK_KEY = 'convenience_store_lock';

let cards = [];
let currentFilter = 'all';
let selectedCardId = null;
let pendingBatchFiles = [];
let cameraStream = null;
let cameraDetectLoop = null;

/* New state for split-payment flow */
let pendingSplit = null; 
// pendingSplit = { transactionId, store, cardsToUse: [{id,balance}], remainingAmount, currentIndex, autoAdvance }

const storeConfigs = {
  '7-11': { name: '7-ELEVEN', badge: 'bg-emerald-600' },
  'FamilyMart': { name: '全家 FamilyMart', badge: 'bg-blue-600' },
  'Hi-Life': { name: '萊爾富 Hi-Life', badge: 'bg-red-600' },
  '宜睿': { name: '宜睿', badge: 'bg-rose-700' }
};

function detectBarcodeFormat(code) {
  if (typeof code !== 'string') code = String(code || '');
  if (/^\d{13}$/.test(code.trim())) return 'EAN13';
  if (/^\d{8}$/.test(code.trim())) return 'EAN8';
  if (/^\d{12}$/.test(code.trim())) return 'UPC';
  if (/^[A-Z0-9\-\. \$/\+\%]+$/i.test(code.trim())) return 'CODE39';
  return 'CODE128';
}

function safeStorageGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeStorageSet(k,v){ try{ localStorage.setItem(k,v);}catch(e){} }

function getRandomIntInclusive(min,max){ min=Math.ceil(min); max=Math.floor(max); return Math.floor(Math.random()*(max-min+1))+min; }

function generateUUID(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){ const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16); }); }

/* Load / Save: preserve null balances and keep originalFormat */
function loadCardsFromStorage(){
  const raw = safeStorageGet(STORAGE_KEY);
  if (raw){
    try{
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)){
        cards = parsed.map(c=>({
          ...c,
          code: c.code==null?'':String(c.code),
          // keep both fields to be compatible; originalFormat preferred
          originalFormat: c.originalFormat || c.format || detectBarcodeFormat(c.code),
          format: c.format || c.originalFormat || detectBarcodeFormat(c.code),
          balance: (c.balance === null || c.balance === undefined) ? null : Number(c.balance)
        }));
        return;
      }
    }catch(e){ console.error('load parse error', e); }
  }
  // default if none
  cards = [
    { id: '1', store:'7-11', code:'4710088432109', originalFormat:'EAN13', format:'EAN13', balance:350, date:'2026-03-10' },
    { id: '2', store:'FamilyMart', code:'5900128473', originalFormat:'CODE128', format:'CODE128', balance:120, date:'2026-03-12' },
    { id: '3', store:'Hi-Life', code:'4710382910', originalFormat:'CODE128', format:'CODE128', balance:0, date:'2026-02-28' },
    { id: '4', store:'宜睿', code:'4719001122', originalFormat:'CODE128', format:'CODE128', balance:200, date:'2026-03-15' }
  ];
  saveCardsToStorage();
}
function saveCardsToStorage(){
  try{
    const normalized = cards.map(c=>({
      ...c,
      code: String(c.code),
      // preserve explicit null for unknown balances
      balance: (c.balance === null || c.balance === undefined) ? null : Number(c.balance),
      // persist originalFormat when available
      originalFormat: c.originalFormat || null,
      format: c.format || c.originalFormat || null
    }));
    safeStorageSet(STORAGE_KEY, JSON.stringify(normalized));
  }catch(e){ console.error(e); }
}

/* Redemptions & locking (kept simple, same as before) */
function loadRedemptions(){ try{ const r=safeStorageGet(REDEMPTION_KEY); if(!r) return []; const p=JSON.parse(r); return Array.isArray(p)?p:[] }catch(e){return []} }
function saveRedemptions(arr){ try{ safeStorageSet(REDEMPTION_KEY, JSON.stringify(arr||[])); }catch(e){} }

async function acquireLock(ownerId, ttl=3000, retries=6, waitMs=200){
  for(let i=0;i<retries;i++){
    const now=Date.now();
    const raw=safeStorageGet(LOCK_KEY);
    let lock=null;
    try{ lock = raw?JSON.parse(raw):null }catch(e){ lock=null }
    if(!lock || !lock.expires || lock.expires < now){
      const nl={owner:ownerId, expires: now+ttl};
      safeStorageSet(LOCK_KEY, JSON.stringify(nl));
      const check = safeStorageGet(LOCK_KEY);
      try{ const parsed = check?JSON.parse(check):null; if(parsed && parsed.owner===ownerId) return true }catch(e){}
    }
    await new Promise(r=>setTimeout(r, waitMs));
  }
  return false;
}
function releaseLock(ownerId){ try{ const raw=safeStorageGet(LOCK_KEY); if(!raw){ localStorage.removeItem(LOCK_KEY); return; } const lock=JSON.parse(raw); if(lock.owner===ownerId) localStorage.re[...]

/* Atomic single-card update */
async function updateCardBalanceAtomic(cardId, amount, idempotencyKey=null){
  if(!idempotencyKey) idempotencyKey = generateUUID();
  if(!Number.isFinite(amount) || amount <= 0) throw new Error('Invalid amount');
  const ownerId = generateUUID();
  const got = await acquireLock(ownerId, 4000, 8, 150);
  if(!got) throw new Error('無法取得鎖（請稍後再試）');
  try{
    const red = loadRedemptions();
    if(red.some(r=> r.idempotencyKey === idempotencyKey)) return { status:'already_processed' };
    const raw = safeStorageGet(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    const local = Array.isArray(parsed)? parsed: [];
    const idx = local.findIndex(c=> String(c.id) === String(cardId));
    if(idx===-1) throw new Error('找不到指定卡片');
    const card = local[idx];
    const cur = Number(card.balance) || 0;
    if(cur < amount) throw new Error('餘額不足');
    local[idx] = { ...card, balance: Math.max(0, cur - amount) };
    const redemption = { idempotencyKey, transactionId: idempotencyKey, cardId: String(cardId), amount:Number(amount), ts:new Date().toISOString() };
    red.push(redemption);
    safeStorageSet(STORAGE_KEY, JSON.stringify(local));
    saveRedemptions(red);
    cards = local;
    renderRedemptions();
    return { status:'ok', redemption, card: local[idx] };
  } finally {
    releaseLock(ownerId);
  }
}

/* Render helpers */
function safeRenderBarcode(selector, code, format, options={}){
  const fmt = format || detectBarcodeFormat(code);
  try {
    JsBarcode(selector, String(code), { format: fmt, height: options.height||40, displayValue:false, margin:0, lineColor: options.lineColor || "#0f172a" });
  } catch(e){
    try { JsBarcode(selector, String(code), { format: "CODE128", height: options.height||40, displayValue:false, margin:0 }); } catch(e2){ console.error(e2); }
  }
}
function escapeHtml(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;"); }

function calculateTotalBalance(){
  const total = cards.filter(c=>Number(c.balance)>0).reduce((s,c)=>s+Number(c.balance||0),0);
  const el = document.getElementById('total-balance');
  if(el) el.innerText = `NT$ ${total.toLocaleString()}`;
}

/* Render card grid (keeps UI same) */
function renderCards(){
  const grid = document.getElementById('card-grid');
  const empty = document.getElementById('empty-state');
  if(!grid || !empty) return;
  grid.innerHTML = '';
  const filtered = cards.filter(c => currentFilter==='all' || c.store === currentFilter);
  empty.classList.toggle('hidden', filtered.length > 0);
  filtered.forEach(card=>{
    const isDepleted = Number(card.balance) <= 0;
    const cfg = storeConfigs[card.store]||{name:card.store||'未知', badge:'bg-slate-500'};
    const el = document.createElement('div');
    el.className = `bg-white rounded-2xl shadow-sm border ${isDepleted?'border-slate-300 grayscale opacity-75':'border-slate-200'} p-5`;
    const codeText = String(card.code||'');
    const dispFmt = card.originalFormat || card.format || detectBarcodeFormat(codeText);
    el.innerHTML = `
      <div>
        <div class="flex justify-between items-start mb-3">
          <span class="px-2.5 py-1 rounded-md text-xs font-bold text-white ${cfg.badge}">${cfg.name}</span>
          <div class="flex items-center space-x-2">
            ${isDepleted?'<span class="bg-slate-700 text-white text-xs px-2.5 py-0.5 rounded-full">已用完</span>':''}
            <button onclick="openEditModal('${card.id}')" class="text-slate-400 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
          </div>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 my-2 flex flex-col items-center">
          <svg id="barcode-${card.id}" class="w-full h-16"></svg>
          <div class="flex items-center space-x-1.5 mt-1.5">
            <span class="text-xs font-mono text-slate-500">${escapeHtml(codeText)}</span>
            <span class="text-[9px] bg-slate-200 text-slate-600 px-1.5 py-0.2 rounded font-semibold uppercase">${dispFmt}</span>
          </div>
        </div>
      </div>
      <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
        <div>
          <span class="text-xs text-slate-400 block">剩餘金額</span>
          <span class="text-xl font-black ${isDepleted?'text-slate-500 line-through':'text-slate-800'}">NT$ ${card.balance === null || card.balance === undefined ? '—' : Number(card.balance).toLocaleString()}</span>
        </div>
        <button onclick="openPayModal('${card.id}')" ${isDepleted?'disabled':''} class="px-4 py-2 text-sm font-bold rounded-lg ${isDepleted?'bg-slate-200 text-slate-400':'bg-indigo-600 text-white'}">
          <i class="fa-solid fa-qrcode mr-1"></i> 結帳
        </button>
      </div>
    `;
    grid.appendChild(el);
    safeRenderBarcode(`#barcode-${card.id}`, codeText, dispFmt, { height:40, lineColor: isDepleted ? "#64748b":"#0f172a" });
  });
  calculateTotalBalance();
}

/* Simple UI helpers: filter */
function setFilter(store){
  currentFilter = store;
  document.querySelectorAll('.tab-btn').forEach(b=>{ b.classList.remove('bg-indigo-600','text-white'); b.classList.add('bg-white','text-slate-600'); });
  const active = document.getElementById(`tab-${store}`) || document.getElementById(`tab-${store}`); // safe
  const btn = document.getElementById(`tab-${store}`);
  if(btn){ btn.classList.add('bg-indigo-600','text-white'); btn.classList.remove('bg-white','text-slate-600'); }
  renderCards();
}

/* Pay modal open */
function openPayModal(id){
  // reset split state UI
  pendingSplit = null;
  document.getElementById('split-controls').classList.add('hidden');
  document.getElementById('pay-submit').classList.remove('hidden');

  selectedCardId = id;
  const card = cards.find(c=>String(c.id)===String(id));
  if(!card) return;
  const cfg = storeConfigs[card.store] || { name: card.store || '未知', badge:'bg-slate-500' };
  const badge = document.getElementById('modal-store-badge');
  badge.innerText = cfg.name; badge.className = `px-3 py-1 rounded-full text-xs font-bold text-white inline-block mb-1 ${cfg.badge}`;
  document.getElementById('pay-card-num').innerText = String(card.code);
  // prefer originalFormat when available
  const renderFmt = card.originalFormat || card.format || detectBarcodeFormat(card.code);
  document.getElementById('pay-barcode-format').innerText = renderFmt;
  document.getElementById('pay-modal-balance').innerText = `NT$ ${card.balance === null || card.balance === undefined ? '—' : Number(card.balance).toLocaleString()}`;
  document.getElementById('deduct-amount').value = '';
  safeRenderBarcode("#pay-barcode", String(card.code), renderFmt, { height:70, lineColor:"#0f172a" });
  document.getElementById('pay-modal').classList.remove('hidden');
}

/* Close modal */
function closeModal(id){
  const m = document.getElementById(id);
  if(m) m.classList.add('hidden');
  // reset pendingSplit when closing
  if(id === 'pay-modal'){
    pendingSplit = null;
    document.getElementById('split-controls').classList.add('hidden');
    document.getElementById('pay-submit').classList.remove('hidden');
  }
}

/* Payment flow:
   - If single card has enough => normal atomic update
   - If not enough => prepare pendingSplit:
       * gather same-store cards with positive balance sorted ascending
       * remainingAmount = requested amount
       * currentIndex = index of first card to present (start with the selected card if in list, else smallest)
       * show split-controls and display barcode for currentIndex card
   - User uses physical card at cashier and then taps "標記已用此卡並扣款" => we will deduct min(card.balance, remainingAmount) from that card (atomic) and update remainingAmount
   - If remainingAmount > 0:
       * if auto-advance checkbox set => automatically advance to next card and show its barcode
       * otherwise user can press "下一張" to show next barcode
   - When remainingAmount reaches 0 => finish and show summary
*/

/* Utility: get same-store cards sorted ascending by balance (positive only) */
function getSameStoreCardsSorted(store){
  return cards.filter(c=>c.store === store && Number(c.balance) > 0).map(c=>({ id:String(c.id), balance:Number(c.balance) })).sort((a,b)=> a.balance - b.balance || a.id.localeCompare(b.id));
}

/* handleCheckout invoked by form submit */
async function handleCheckout(e){
  e.preventDefault();
  const amount = parseInt(document.getElementById('deduct-amount').value,10);
  if(isNaN(amount) || amount<=0){ alert('請輸入有效的扣款金額'); return; }
  const card = cards.find(c=>String(c.id)===String(selectedCardId));
  if(!card){ alert('找不到卡片'); return; }
  const cur = Number(card.balance) || 0;
  if(cur >= amount){
    // single-card atomic
    try{
      const idempotencyKey = generateUUID();
      const res = await updateCardBalanceAtomic(card.id, amount, idempotencyKey);
      if(res.status==='ok' || res.status==='already_processed'){
        saveCardsToStorage();
        renderCards();
        closeModal('pay-modal');
        if(res.status==='ok') alert(`扣款成功：NT$ ${amount}\n新餘額：NT$ ${Number(res.card.balance).toLocaleString()}`);
        else alert('此交易已處理過，未重複扣款');
      }
    }catch(err){
      if(String(err.message).includes('餘額不足')) alert('餘額不足，請確認金額或使用其他付款方式');
      else { alert('扣款失敗：'+String(err.message)); console.error(err); }
    }
    return;
  }

  // Need split flow across same-store cards
  const store = card.store;
  const same = getSameStoreCardsSorted(store);
  // ensure selected card appears first if it has positive balance (user likely started with it)
  const selectedIdx = same.findIndex(c=>c.id===String(card.id));
  if(selectedIdx > 0){
    // move selected card to front
    const sel = same.splice(selectedIdx,1)[0];
    same.unshift(sel);
  }
  const totalAvailable = same.reduce((s,c)=>s + (Number(c.balance)||0), 0);
  if(totalAvailable < amount){
    alert(`同超商卡片總額 NT$ ${totalAvailable} 不足以支付 NT$ ${amount}`);
    return;
  }

  // prepare pendingSplit
  pendingSplit = {
    transactionId: generateUUID(),
    store,
    cardsToUse: same, // each {id,balance}
    remainingAmount: amount,
    currentIndex: 0,
    autoAdvance: false
  };

  // show split UI and first card
  document.getElementById('split-remaining').innerText = `NT$ ${pendingSplit.remainingAmount}`;
  document.getElementById('split-controls').classList.remove('hidden');
  document.getElementById('pay-submit').classList.add('hidden');

  // render first card barcode
  showCurrentSplitCard();
}

/* Show current card (in split flow) */
function showCurrentSplitCard(){
  if(!pendingSplit) return;
  const idx = pendingSplit.currentIndex;
  if(idx >= pendingSplit.cardsToUse.length){
    // nothing more
    return;
  }
  const entry = pendingSplit.cardsToUse[idx];
  const card = cards.find(c => String(c.id) === String(entry.id));
  if(!card) {
    // skip and advance
    advanceSplitToNext();
    return;
  }
  // display this card's barcode info (preserve original format)
  document.getElementById('pay-card-num').innerText = String(card.code);
  const renderFmt = card.originalFormat || card.format || detectBarcodeFormat(card.code);
  document.getElementById('pay-barcode-format').innerText = renderFmt;
  document.getElementById('pay-modal-balance').innerText = `NT$ ${card.balance === null || card.balance === undefined ? '—' : Number(card.balance).toLocaleString()}`;
  safeRenderBarcode("#pay-barcode", String(card.code), renderFmt, { height: 70, lineColor: "#0f172a" });
  document.getElementById('split-remaining').innerText = `NT$ ${pendingSplit.remainingAmount}`;
}

/* Mark current split card as used: deduct min(card.balance, remainingAmount) */
async function markCurrentSplitCardPaid(){
  if(!pendingSplit) return alert('無待處理之分次付款');
  const idx = pendingSplit.currentIndex;
  if(idx >= pendingSplit.cardsToUse.length) return alert('沒有下一張卡片');
  const entry = pendingSplit.cardsToUse[idx];
  const card = cards.find(c => String(c.id) === String(entry.id));
  if(!card) { advanceSplitToNext(); return; }
  const take = Math.min(Number(card.balance)||0, pendingSplit.remainingAmount);
  if(take <= 0){
    // nothing to take, advance
    advanceSplitToNext();
    return;
  }

  try{
    const idempotencyKey = `${pendingSplit.transactionId}-${card.id}`;
    const res = await updateCardBalanceAtomic(card.id, take, idempotencyKey);
    if(res.status === 'ok' || res.status === 'already_processed'){
      // reduce pending remaining
      pendingSplit.remainingAmount -= take;
      // update local cardsToUse balances to reflect latest
      pendingSplit.cardsToUse[idx].balance = Number(res.card.balance || 0);

      document.getElementById('split-remaining').innerText = `NT$ ${pendingSplit.remainingAmount}`;

      if(pendingSplit.remainingAmount <= 0){
        // finish
        saveCardsToStorage();
        renderCards();
        alert(`扣款完成：NT$ ${ (Number(pendingSplit.transactionId) ? '' : '') } 已完成所有扣款`); // message
        pendingSplit = null;
        // restore normal UI
        document.getElementById('split-controls').classList.add('hidden');
        document.getElementById('pay-submit').classList.remove('hidden');
        closeModal('pay-modal');
        return;
      }

      // still need more -> advance according to autoAdvance flag
      saveCardsToStorage();
      renderCards();
      if(document.getElementById('auto-advance-toggle').checked){
        advanceSplitToNext();
      } else {
        // keep showing current card but it's now likely depleted; user can press "下一張"
        // update displayed balance
        document.getElementById('pay-modal-balance').innerText = `NT$ ${Number(res.card.balance).toLocaleString()}`;
      }
    }
  }catch(err){
    if(String(err.message).includes('餘額不足')) {
      alert('此卡餘額不足，將跳到下一張');
      advanceSplitToNext();
    } else {
      alert('扣款失敗：' + String(err.message));
      console.error(err);
    }
  }
}

/* Advance to next split card (manual) */
function advanceSplitToNext(){
  if(!pendingSplit) return;
  pendingSplit.currentIndex++;
  if(pendingSplit.currentIndex >= pendingSplit.cardsToUse.length){
    // no more cards (shouldn't happen if totalAvailable check passed)
    alert('沒有更多可用卡片，請檢查卡片餘額');
    return;
  }
  showCurrentSplitCard();
}

/* UI: mark auto advance toggle */
document.addEventListener('change', (e)=>{
  if(e.target && e.target.id === 'auto-advance-toggle' && pendingSplit){
    pendingSplit.autoAdvance = e.target.checked;
  }
});

/* Render redemptions list */
function renderRedemptions(){ const el=document.getElementById('redemption-list'); if(!el) return; const items = loadRedemptions().slice(-20).reverse(); el.innerHTML = items.map(r=>`<li class="py-1 text-xs">${r.ts} - 卡:${r.cardId} - 扣款:NT$${r.amount} - id:${r.idempotencyKey}</li>`).join(''); }

/* classify helper */
function classifyStoreByBarcode(code){
  const s = String(code||'');
  if(s.startsWith('711') || s.startsWith('471')) return '7-11';
  if(s.startsWith('590')) return 'FamilyMart';
  if(s.startsWith('4710')) return 'Hi-Life';
  return '宜睿';
}

/* Simple batch/import/scan helpers (kept minimal here) */
function triggerFileInput(){ document.getElementById('batch-file-input').click(); }
function handleFileSelect(e){
  const files = e.target.files; if(!files || files.length===0) return;
  // simplified: create random cards (or you can reuse your barcodeDetector code)
  Array.from(files).forEach((f,i)=>{
    const code = '471' + String(Math.floor(100000000 + Math.random()*900000000));
    const origFmt = detectBarcodeFormat(code);
    cards.unshift({ id: (Date.now()+i).toString(), store: classifyStoreByBarcode(code), code, originalFormat: origFmt, format: origFmt, balance: getRandomIntInclusive(50,100), date:new Date().toISOString().split('T')[0] });
  });
  saveCardsToStorage(); renderCards();
  closeModal('batch-modal');
}

/* Edit modal implementation ported from gift.cards */
function openEditModal(id) {
  selectedCardId = id;
  const card = cards.find(c => String(c.id) === String(id));
  if (!card) return;

  // store select: if store isn't in known list, select "other" and fill input
  const storeSelect = document.getElementById('edit-store');
  const storeOther = document.getElementById('edit-store-other');
  if (Object.keys(storeConfigs).includes(card.store)) {
    storeSelect.value = card.store;
    storeOther.value = '';
    storeOther.classList.add('hidden');
  } else if (card.store && card.store !== null) {
    storeSelect.value = 'other';
    storeOther.value = card.store;
    storeOther.classList.remove('hidden');
  } else {
    storeSelect.value = '7-11';
    storeOther.value = '';
    storeOther.classList.add('hidden');
  }

  document.getElementById('edit-code').value = String(card.code);
  document.getElementById('edit-format').value = card.originalFormat || card.format || detectBarcodeFormat(card.code);
  document.getElementById('edit-balance').value = card.balance === null || card.balance === undefined ? '' : Number(card.balance);

  document.getElementById('edit-modal').classList.remove('hidden');
}

function handleSaveEdit(e) {
  e.preventDefault();
  const card = cards.find(c => String(c.id) === String(selectedCardId));
  if (card) {
    // handle store possibly "other"
    const storeSel = document.getElementById('edit-store').value;
    if (storeSel === 'other') {
      const other = document.getElementById('edit-store-other').value.trim();
      card.store = other || 'other';
    } else {
      card.store = storeSel;
    }

    card.code = String(document.getElementById('edit-code').value.trim());
    // write into originalFormat and keep format in sync
    const fmtVal = document.getElementById('edit-format').value;
    card.originalFormat = fmtVal;
    card.format = fmtVal;

    const balVal = document.getElementById('edit-balance').value;
    card.balance = balVal === '' ? null : Math.max(0, parseInt(balVal, 10) || 0);

    saveCardsToStorage();
    renderCards();
    closeModal('edit-modal');
  }
}

function handleDeleteCard() {
  if (confirm('確定要刪除這張商品卡嗎？此動作無法復原。')) {
    cards = cards.filter(c => String(c.id) !== String(selectedCardId));
    saveCardsToStorage();
    renderCards();
    closeModal('edit-modal');
  }
}

/* Boot */
document.addEventListener('DOMContentLoaded', ()=>{
  loadCardsFromStorage();
  renderCards();
  renderRedemptions();
});
</script>
