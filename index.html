<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品卡錢包</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        header p {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* 儲值卡/超商群組卡片 */
        .store-group {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .store-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .store-total-balance {
            font-size: 1.1rem;
            font-weight: bold;
            color: #059669;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .sub-card {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .sub-card-info span {
            display: block;
        }

        .sub-card-id {
            font-weight: 600;
        }

        .sub-card-barcode {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-family: monospace;
        }

        .sub-card-bal {
            font-weight: bold;
            color: #374151;
        }

        /* 按鈕風格 */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
        }

        /* 互動面板 (Modal 簡易版) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--text-main);
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        .result-step {
            background-color: #f3f4f6;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .barcode-box {
            font-family: monospace;
            background: #000;
            color: #fff;
            padding: 6px;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>智慧商品卡錢包</h1>
        <p>同超商自動串接、最小餘額優先折抵</p>
    </header>

    <!-- 動態產生超商群組清單 -->
    <div id="stores-container"></div>

    <!-- 重置預設資料按鈕 -->
    <button class="btn btn-secondary" onclick="resetToDefaultData()">重置/初始化預設卡片資料</button>
</div>

<!-- 結帳互動視窗 -->
<div id="checkout-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-store-title">快速結帳</h3>
        <p style="font-size: 0.9rem; color: var(--text-sub);">請輸入本次消費總金額，系統將自動套用最小餘額優先扣款：</p>
        <input type="number" id="checkout-amount" class="modal-input" placeholder="例如: 350">
        <div id="modal-actions">
            <button class="btn" onclick="confirmCheckout()">確認結帳並顯示條碼</button>
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        </div>
        <div id="checkout-result" style="margin-top: 15px; max-height: 250px; overflow-y: auto;"></div>
    </div>
</div>

<script>
    // 預設資料
    const defaultCards = [
        { id: 'Card-711-A', store: '7-11', balance: 50, barcode: '711-BARCODE-9981' },
        { id: 'Card-711-B', store: '7-11', balance: 300, barcode: '711-BARCODE-5542' },
        { id: 'Card-711-C', store: '7-11', balance: 120, barcode: '711-BARCODE-1103' },
        { id: 'Card-Family-A', store: '全家', balance: 100, barcode: 'FAM-BARCODE-8831' },
        { id: 'Card-Family-B', store: '全家', balance: 500, barcode: 'FAM-BARCODE-2290' },
        { id: 'Card-HiLife-A', store: '萊爾富', balance: 250, barcode: 'HILIFE-BARCODE-7762' }
    ];

    let giftCards = [];
    let activeStoreForCheckout = null;

    // 初始化載入
    function initApp() {
        const saved = localStorage.getItem('my_gift_cards');
        if (saved) {
            try {
                giftCards = JSON.parse(saved);
            } catch (e) {
                giftCards = [...defaultCards];
            }
        } else {
            giftCards = [...defaultCards];
            saveCards();
        }
        renderUI();
    }

    function saveCards() {
        localStorage.setItem('my_gift_cards', JSON.stringify(giftCards));
    }

    function resetToDefaultData() {
        if(confirm("確定要重置為預設的商品卡餘額嗎？")) {
            giftCards = [...defaultCards];
            saveCards();
            renderUI();
            alert("已重置！");
        }
    }

    // 渲染 UI 介面
    function renderUI() {
        const container = document.getElementById('stores-container');
        container.innerHTML = '';

        // 依超商分類
        const storesMap = {};
        giftCards.forEach(card => {
            if (!storesMap[card.store]) {
                storesMap[card.store] = [];
            }
            storesMap[card.store].push(card);
        });

        // 建立各超商區塊
        for (let storeName in storesMap) {
            let cards = storesMap[storeName];
            // 畫面也順便將該超商內的卡片依餘額排序顯示
            cards.sort((a, b) => a.balance - b.balance);

            let totalBalance = cards.reduce((sum, c) => sum + c.balance, 0);

            let storeDiv = document.createElement('div');
            storeDiv.className = 'store-group';
            
            let cardListHtml = cards.map(c => `
                <div class="sub-card">
                    <div class="sub-card-info">
                        <span class="sub-card-id">${c.id}</span>
                        <span class="sub-card-barcode">條碼: ${c.barcode}</span>
                    </div>
                    <div class="sub-card-bal">$${c.balance}</div>
                </div>
            `).join('');

            storeDiv.innerHTML = `
                <div class="store-header">
                    <span class="store-title">${storeName} 商品卡</span>
                    <span class="store-total-balance">總餘額: $${totalBalance}</span>
                </div>
                <div class="card-list">
                    ${cardListHtml}
                </div>
                <button class="btn" onclick="openCheckoutModal('${storeName}')">使用 ${storeName} 結帳 (自動串接)</button>
            `;
            container.appendChild(storeDiv);
        }
    }

    // 彈跳視窗控制
    function openCheckoutModal(storeName) {
        activeStoreForCheckout = storeName;
        document.getElementById('modal-store-titleinnerText').innerText = `${storeName} 快速結帳`;
        document.getElementById('checkout-amount').value = '';
        document.getElementById('checkout-result').innerHTML = '';
        document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('checkout-modal').style.display = 'none';
        activeStoreForCheckout = null;
        renderUI(); // 關閉時重新整理主畫面以更新餘額
    }

    // 核心扣款邏輯：最小餘額優先
    function confirmCheckout() {
        let amountInput = document.getElementById('checkout-amount').value;
        let amount = parseFloat(amountInput);

        if (isNaN(amount) || amount <= 0) {
            alert("請輸入正確的消費金額！");
            return;
        }

        // 1. 抓出該超商卡片並強制「最小餘額優先」排序
        let storeCards = giftCards.filter(c => c.store === activeStoreForCheckout);
        storeCards.sort((a, b) => a.balance - b.balance);

        let totalAvailable = storeCards.reduce((sum, c) => sum + c.balance, 0);

        let resultContainer = document.getElementById('checkout-result');

        if (totalAvailable < amount) {
            resultContainer.innerHTML = `<p style="color: red; font-weight: bold;">扣款失敗：${activeStoreForCheckout} 總餘額不足（可用總額 $${totalAvailable}）</p>`;
            return;
        }

        let remainingAmount = amount;
        let logs = [];

        // 2. 迴圈依序扣款
        for (let card of storeCards) {
            if (remainingAmount <= 0) break;

            let deduct = Math.min(card.balance, remainingAmount);
            card.balance -= deduct;
            remainingAmount -= deduct;

            logs.push({
                cardId: card.id,
                barcode: card.barcode,
                deducted: deduct,
                newBalance: card.balance
            });
        }

        // 3. 儲存最新狀態
        saveCards();

        // 4. 顯示連續刷卡與條碼指引
        let htmlResult = `<p style="color: green; font-weight: bold; margin-bottom: 10px;">✅ 扣款成功！請依序出示以下條碼：</p>`;
        logs.forEach((log, index) => {
            htmlResult += `
                <div class="result-step">
                    <strong>步驟 ${index + 1}：請刷 ${log.cardId}</strong><br>
                    扣抵金額：<span style="color: #d97706; font-weight: bold;">$${log.deducted}</span> (卡片剩餘: $${log.newBalance})
                    <div class="barcode-box">║█║▌║█║${log.barcode}</div>
                </div>
            `;
        });

        resultContainer.innerHTML = htmlResult;
    }

    // 頁面載入初始化
    window.onload = initApp;
</script>

</body>
</html>
